<title>SaniSMP – BYTEZ</title>
<meta name="description" content="Meine Arbeit für den Minecraft-Server SaniSMP.">
<meta name="theme-color" content="#0a0b10">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@1&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b10;--ink:#eef0f6;--mute:#8b92a5;--line:#232736;--acc:#7b94ff;--glass:linear-gradient(160deg,#1a1e2e99,#10131d99);
--display:'Anton',Impact,sans-serif;--sans:'Hanken Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:radial-gradient(60rem 30rem at 15% -5%,#1b2550 0,transparent 60%),var(--bg);color:var(--ink);font:400 1.05rem/1.7 var(--sans);min-height:100vh}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:8px}
.top{display:flex;justify-content:space-between;align-items:center;max-width:52rem;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 1.2rem) 1.5rem 0}
.badge{display:block;padding:.5rem 1rem;border:1px solid var(--line);border-radius:12px;background:#0d0f17cc;text-decoration:none}
.badge b{display:block;font:400 1.1rem/1.1 var(--display);letter-spacing:.08em}
.badge span{font:.6rem var(--mono);letter-spacing:.18em;color:var(--mute)}
.back{color:var(--mute);text-decoration:none;font-weight:500}
.back:hover{color:var(--ink)}
main{max-width:52rem;margin:0 auto;padding:4rem 1.5rem 3rem}
.idx{font:.72rem var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:0 0 1.2rem}
.hero{display:flex;gap:1.6rem;align-items:center;margin-bottom:3rem}
.logo{flex:none;width:6.5rem;height:6.5rem;border-radius:20px;object-fit:cover;display:block}
h1{font:400 clamp(3.2rem,11vw,6.5rem)/.9 var(--display);text-transform:uppercase;margin:0 0 .6rem}
.pill{display:inline-block;padding:.2rem .75rem;border:1px solid #3a4c9c;border-radius:99px;font:.68rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);vertical-align:middle;margin-right:.7rem}
.meta{color:var(--mute);font-size:1.1rem;display:inline}
.panel{padding:1.7rem;border:1px solid var(--line);border-radius:22px;background:var(--glass);margin-bottom:1.1rem}
h2{font:400 1.5rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0 0 1rem}
.panel p{margin:0;color:var(--mute)}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
.tasks li{display:flex;gap:.8rem;color:var(--ink)}
.tasks li::before{content:"✓";color:var(--acc);font-weight:700}
.rows{display:grid;grid-template-columns:9rem 1fr;gap:.7rem 1.2rem;align-items:center;margin:0}
.rows dt{font:.72rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.rows dd{margin:0}
.ip{display:inline-flex;align-items:center;gap:.8rem;padding:.4rem .5rem .4rem 1rem;border:1px solid var(--line);border-radius:12px;background:#10131d;font:.92rem var(--mono);max-width:100%}
.ip button{font:inherit;color:var(--ink);background:none;border:1px solid var(--line);border-radius:8px;padding:.2rem .7rem;cursor:pointer}
.ip button:hover{border-color:var(--acc)}
.btn{display:inline-block;margin-top:1.2rem;padding:.8rem 1.5rem;border-radius:12px;font-weight:600;text-decoration:none;background:var(--ink);color:var(--bg)}
.btn:hover{background:var(--acc)}
.note{font-size:.85rem;color:var(--mute);margin-top:2rem}
footer{border-top:1px solid var(--line);margin-top:2.5rem;padding-top:1.4rem;color:var(--mute);font-size:.88rem}
@media(max-width:40rem){.hero{flex-direction:column;align-items:flex-start}.rows{grid-template-columns:1fr;gap:.2rem}.rows dd{margin-bottom:.8rem}}
</style>
</head>

<p class="note">Name und Logo von SaniSMP gehören dem Server. Sie werden hier gezeigt, um meine Arbeit darzustellen.</p>

<script id="data">
var SERVER={
  role:"Owner & Developer",
  since:"November 2026",
  status:"Aktiv",
  about:"Ein Survival-SMP mit Shop.",
  tasks:[
    "Owner des Servers",
    "Entwicklung von Plugins, Skripten und Configs",
    "Alles rund um den Server"
  ],
  ip:"mc.sanismp.net",
  version:"1.21.11",
  invite:"https://discord.gg/hEM8qpXpP6"
};
</script>

<script>
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function panel(title){var p=el("section","panel");p.appendChild(el("h2",null,title));document.getElementById("content").appendChild(p);return p}

var st=document.getElementById("status");
if(SERVER.status){st.textContent=SERVER.status}else{st.style.display="none"}
var meta=[];
if(SERVER.role)meta.push(SERVER.role);
if(SERVER.since)meta.push("seit "+SERVER.since);
document.getElementById("meta").textContent=meta.join(" ");

if(SERVER.about){panel("Worum es geht").appendChild(el("p",null,SERVER.about))}

if(SERVER.tasks&&SERVER.tasks.length){
  var tp=panel("Meine Aufgaben"),ul=el("ul","tasks");
  SERVER.tasks.forEach(function(t){ul.appendChild(el("li",null,t))});
  tp.appendChild(ul);
}

var hasInvite=typeof SERVER.invite==="string"&&/^https:\/\//.test(SERVER.invite);
if(SERVER.ip||SERVER.version||hasInvite){
  var sp=panel("Server-Infos"),dl=el("dl","rows");
  if(SERVER.ip){
    dl.appendChild(el("dt",null,"IP-Adresse"));
    var dd=el("dd"),box=el("span","ip"),val=el("span",null,SERVER.ip),b=el("button",null,"Kopieren");
    b.type="button";
    b.addEventListener("click",function(){
      function done(){b.textContent="Kopiert";setTimeout(function(){b.textContent="Kopieren"},1800)}
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(SERVER.ip).then(done,function(){})}
      else{var t=document.createElement("textarea");t.value=SERVER.ip;document.body.appendChild(t);t.select();try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(t)}
    });
    box.appendChild(val);box.appendChild(b);dd.appendChild(box);dl.appendChild(dd);
  }
  if(SERVER.version){dl.appendChild(el("dt",null,"Version"));dl.appendChild(el("dd",null,SERVER.version))}
  sp.appendChild(dl);
  if(hasInvite){var a=el("a","btn","Discord beitreten");a.href=SERVER.invite;a.target="_blank";a.rel="noopener";sp.appendChild(a)}
}

document.getElementById("y").textContent=new Date().getFullYear();
</script>
